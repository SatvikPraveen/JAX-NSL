[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-nsl"
version = "0.1.0"
description = "Neural Scientific Learning with JAX – educational framework for learning JAX"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Satvik Praveen", email = "satvikpraveen707@gmail.com" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Education",
]
dependencies = [
    "jax>=0.4.30",
    "flax>=0.7.0",
    "optax>=0.1.7",
    "numpy>=1.21.0",
    "scipy>=1.9.0",
    "tqdm>=4.64.0",
    "rich>=12.0.0",
]

[project.optional-dependencies]
notebook = [
    "jupyter>=1.0.0",
    "optax>=0.2.0",
    "psutil>=5.9.0",
    "nbconvert>=7.0.0",
    "ipykernel>=6.0.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "plotly>=5.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "nbsphinx>=0.8.0",
]
all = ["jax-nsl[notebook,dev,docs]"]

[project.urls]
"Homepage" = "https://github.com/SatvikPraveen/JAX-NSL"
"Bug Tracker" = "https://github.com/SatvikPraveen/JAX-NSL/issues"

# ---------------------------------------------------------------------------
# Tool configurations
# ---------------------------------------------------------------------------

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
  | \.eggs
)/
'''

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src", "tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["venv/", ".venv/", "build/", "dist/"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["venv", ".venv", "build", "dist", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501", "N802", "N803", "N806", "E731", "B905", "B023", "N812"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--tb=short --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:jax_nsl",
    "ignore::UserWarning",
]
markers = [
    "slow: mark test as slow (deselect with -m \"not slow\")",
    "gpu: mark test as requiring a GPU",
    "multi_device: mark test as requiring multiple devices",
]

[tool.coverage.run]
source = ["jax_nsl"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
