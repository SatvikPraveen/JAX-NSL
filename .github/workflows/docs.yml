name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    name: Build Sphinx docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with docs extras
        run: |
          pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Build HTML (warnings are errors)
        run: sphinx-build -b html -c docs docs/source docs/_build/html -W --keep-going
