name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install ruff black isort
      - run: ruff check src tests
      - run: black --check src tests
      - run: isort --check-only src tests

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package (CPU JAX) with dev extras
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests (8 virtual CPU devices are configured in tests/conftest.py)
        run: pytest tests/ --tb=short -q
      - name: Coverage
        if: matrix.python-version == '3.11'
        run: pytest tests/ -q --cov=jax_nsl --cov-report=xml --cov-report=term
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  notebooks:
    name: Execute notebooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          pip install --upgrade pip
          pip install -e ".[dev,notebook]" nbconvert ipykernel
      - name: Execute every notebook
        env:
          MPLBACKEND: Agg
        run: |
          set -e
          for nb in notebooks/*/*.ipynb; do
            echo "=== $nb"
            jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=900 \
              --output-dir /tmp/executed "$nb"
          done
